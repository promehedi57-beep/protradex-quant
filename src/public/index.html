<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APEX//QUANT - Quantum Signal Terminal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            900: '#0b0f17',
                            800: '#111827',
                            700: '#1f2937',
                            600: '#374151',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap');
        body {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="bg-dark-900 text-gray-100 min-h-screen flex flex-col">

    <!-- Top Header Navigation -->
    <header class="bg-dark-800 border-b border-dark-600 px-4 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 text-white p-2 rounded font-bold text-lg tracking-wider">
                <i class="fa-solid fa-chart-line"></i> APEX//QUANT
            </div>
            <span class="text-xs bg-dark-700 px-2 py-1 rounded text-emerald-400 border border-emerald-500/30">
                <i class="fa-solid fa-circle text-[8px] animate-pulse"></i> LIVE ENGINE
            </span>
        </div>
        <div class="flex items-center space-x-4">
            <div id="connection-status" class="text-xs text-gray-400 flex items-center space-x-1">
                <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                <span>Connected</span>
            </div>
            <button onclick="openSettings()" class="bg-dark-700 hover:bg-dark-600 px-3 py-1.5 rounded text-sm transition">
                <i class="fa-solid fa-gear"></i> Settings
            </button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="flex-1 p-4 grid grid-cols-1 lg:grid-cols-3 gap-4">
        
        <!-- Left & Center: Signals Display Panel (Span 2) -->
        <section class="lg:col-span-2 bg-dark-800 border border-dark-600 rounded-lg p-4 flex flex-col">
            <div class="flex justify-between items-center mb-4 border-b border-dark-600 pb-2">
                <h2 class="text-lg font-bold text-blue-400"><i class="fa-solid fa-satellite-dish"></i> Live Quant Signals</h2>
                <span id="signal-count" class="text-xs bg-dark-700 px-2 py-1 rounded text-gray-300">Total: 0</span>
            </div>
            
            <div id="signals-container" class="space-y-3 overflow-y-auto flex-1 max-h-[600px] pr-1">
                <!-- Dynamic Signal Cards will be injected here -->
                <div class="text-center text-gray-500 py-10">
                    <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                    <p>Fetching market intelligence...</p>
                </div>
            </div>
        </section>

        <!-- Right Sidebar: Statistics & Controls -->
        <section class="bg-dark-800 border border-dark-600 rounded-lg p-4 flex flex-col space-y-4">
            <h2 class="text-lg font-bold text-emerald-400 border-b border-dark-600 pb-2">
                <i class="fa-solid fa-chart-pie"></i> Performance Stats
            </h2>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-dark-700 p-3 rounded border border-dark-600 text-center">
                    <div class="text-xs text-gray-400">WIN RATE</div>
                    <div id="stat-winrate" class="text-xl font-bold text-emerald-400">0.0%</div>
                </div>
                <div class="bg-dark-700 p-3 rounded border border-dark-600 text-center">
                    <div class="text-xs text-gray-400">TOTAL SIGNALS</div>
                    <div id="stat-total" class="text-xl font-bold text-blue-400">0</div>
                </div>
                <div class="bg-dark-700 p-3 rounded border border-dark-600 text-center">
                    <div class="text-xs text-gray-400">WINS</div>
                    <div id="stat-wins" class="text-lg font-bold text-emerald-500">0</div>
                </div>
                <div class="bg-dark-700 p-3 rounded border border-dark-600 text-center">
                    <div class="text-xs text-gray-400">LOSSES</div>
                    <div id="stat-losses" class="text-lg font-bold text-rose-500">0</div>
                </div>
            </div>

            <div class="mt-auto pt-4 border-t border-dark-600">
                <button onclick="triggerManualScan()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded font-bold transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-bolt"></i><span>Force Market Scan</span>
                </button>
            </div>
        </section>

    </main>

    <!-- Settings Modal (Hidden by Default) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/70 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-dark-800 border border-dark-600 rounded-lg p-5 w-full max-w-md">
            <div class="flex justify-between items-center mb-4 border-b border-dark-600 pb-2">
                <h3 class="font-bold text-lg"><i class="fa-solid fa-sliders"></i> Terminal Settings</h3>
                <button onclick="closeSettings()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Confidence Threshold (%)</label>
                    <input type="number" id="input-confidence" value="60" class="w-full bg-dark-700 border border-dark-600 rounded p-2 text-white">
                </div>
                <div class="flex items-center justify-between">
                    <span class="text-sm text-gray-300">Sound Alerts</span>
                    <input type="checkbox" id="input-sound" class="w-4 h-4 accent-blue-600">
                </div>
            </div>
            <div class="mt-6 flex justify-end space-x-2">
                <button onclick="closeSettings()" class="bg-dark-700 hover:bg-dark-600 px-4 py-2 rounded text-sm">Cancel</button>
                <button onclick="saveSettings()" class="bg-emerald-600 hover:bg-emerald-700 px-4 py-2 rounded text-sm font-bold">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-dark-800 border-t border-dark-600 text-center py-2 text-xs text-gray-500">
        APEX//QUANT Terminal v2.5 &bull; Secured Local Connection
    </footer>

    <!-- App Logic JavaScript -->
    <script>
        const API_BASE = ''; // একই সার্ভার বা লোকাল হোস্টের জন্য খালি রাখা হলো

        async function fetchStatus() {
            try {
                // ব্যাকএন্ড API থেকে ডেটা ফেচ করা
                let res = await fetch(`${API_BASE}/api/status`);
                if (!res.ok) throw new Error('Network response was not ok');
                let data = await res.json();
                
                updateUI(data);
            } catch (err) {
                console.error("API Error, using fallback simulation data:", err);
                // ব্যাকএন্ড অফলাইন থাকলে ডেমো ডেটা দেখাবে
                updateUI({
                    status: 'online',
                    signals: [
                        { id: '1', pair: 'BTC/USDT', market: 'CRYPTO', direction: 'CALL', confidence: 85, rsi: 24.2, entry: 64200, timestamp: Date.now() },
                        { id: '2', pair: 'EUR/USD', market: 'FOREX', direction: 'PUT', confidence: 78, rsi: 72.5, entry: 1.0850, timestamp: Date.now() }
                    ],
                    stats: { wins: 18, losses: 4, winRate: 81.8, totalSignals: 22 }
                });
            }
        }

        function updateUI(data) {
            // স্ট্যাট আপডেট
            if (data.stats) {
                document.getElementById('stat-winrate').innerText = data.stats.winRate + '%';
                document.getElementById('stat-total').innerText = data.stats.totalSignals;
                document.getElementById('stat-wins').innerText = data.stats.wins;
                document.getElementById('stat-losses').innerText = data.stats.losses;
            }

            // সিগন্যাল রেন্ডার
            const container = document.getElementById('signals-container');
            if (data.signals && data.signals.length > 0) {
                document.getElementById('signal-count').innerText = `Total: ${data.signals.length}`;
                container.innerHTML = data.signals.map(sig => `
                    <div class="bg-dark-700 border border-dark-600 rounded p-3 flex justify-between items-center">
                        <div>
                            <div class="flex items-center space-x-2">
                                <span class="font-bold text-white">${sig.pair}</span>
                                <span class="text-[10px] bg-dark-600 px-1.5 py-0.5 rounded text-gray-300">${sig.market}</span>
                                <span class="text-xs px-2 py-0.5 rounded font-bold ${sig.direction === 'CALL' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-rose-500/20 text-rose-400'}">${sig.direction}</span>
                            </div>
                            <div class="text-xs text-gray-400 mt-1">Entry: ${sig.entry} | RSI: ${sig.rsi}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-sm font-bold text-blue-400">${sig.confidence}% Conf</div>
                            <button onclick="shareToTelegram('${sig.pair}', '${sig.direction}')" class="mt-1 text-xs bg-blue-600/30 hover:bg-blue-600 text-blue-300 hover:text-white px-2 py-1 rounded transition">
                                <i class="fa-brands fa-telegram"></i> Share
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                container.innerHTML = `<div class="text-center text-gray-500 py-10">No active signals found.</div>`;
            }
        }

        function openSettings() {
            document.getElementById('settings-modal').classList.remove('hidden');
        }

        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
        }

        async function saveSettings() {
            const confidence = document.getElementById('input-confidence').value;
            const sound = document.getElementById('input-sound').checked;
            
            try {
                await fetch(`${API_BASE}/api/settings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ confidenceThreshold: confidence, soundAlerts: sound })
                });
                alert('Settings saved successfully!');
            } catch (e) {
                console.error(e);
            }
            closeSettings();
        }

        function triggerManualScan() {
            alert('Manual market scan triggered!');
            fetchStatus();
        }

        async function shareToTelegram(pair, direction) {
            try {
                await fetch(`${API_BASE}/api/share-telegram`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pair, direction })
                });
                alert(`Signal for ${pair} (${direction}) shared to Telegram!`);
            } catch (e) {
                alert('Failed to share signal.');
            }
        }

        // প্রতি ৫ সেকেন্ড পর পর অটো রিফ্রেশ
        setInterval(fetchStatus, 5000);
        fetchStatus();
    </script>
</body>
</html>
